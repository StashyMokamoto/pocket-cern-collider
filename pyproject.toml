[project]
name = "pocket-cern-collider"
version = "0.3.0"
description = "Educational particle-collider simulator: exact relativistic event generation, detector simulation and invariant-mass analysis."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "particle",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # third-party notice from fastapi.testclient (Starlette suggests httpx2); not our code
    "ignore:Using `httpx` with `starlette.testclient`",
]
